<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"
     preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#faf6ea"/>
            <stop offset="0.55" stop-color="#f5efdf"/>
            <stop offset="1" stop-color="#efe6cf"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.85" cy="0.12" r="0.9">
            <stop offset="0" stop-color="#c9a24b" stop-opacity="0.14"/>
            <stop offset="0.5" stop-color="#c9a24b" stop-opacity="0.05"/>
            <stop offset="1" stop-color="#c9a24b" stop-opacity="0"/>
        </radialGradient>
        <g id="rosette" fill="none" stroke="#8a6d2f">
            <circle r="150" stroke-opacity="0.10"/>
            <circle r="130" stroke-opacity="0.12"/>
            <circle r="110" stroke-opacity="0.10"/>
            <circle r="90" stroke-opacity="0.12"/>
            <circle r="70" stroke-opacity="0.10"/>
            <ellipse rx="150" ry="60" stroke-opacity="0.08"/>
            <ellipse rx="150" ry="60" stroke-opacity="0.08" transform="rotate(30)"/>
            <ellipse rx="150" ry="60" stroke-opacity="0.08" transform="rotate(60)"/>
            <ellipse rx="150" ry="60" stroke-opacity="0.08" transform="rotate(90)"/>
            <ellipse rx="150" ry="60" stroke-opacity="0.08" transform="rotate(120)"/>
            <ellipse rx="150" ry="60" stroke-opacity="0.08" transform="rotate(150)"/>
        </g>
    </defs>

    <rect width="1200" height="640" fill="url(#bg)"/>
    <rect width="1200" height="640" fill="url(#glow)"/>

    <!-- guilloche wave bands -->
    <g fill="none" stroke="#16324f" stroke-opacity="0.10">
        <path d="M-50 520 C 150 440, 350 600, 550 520 S 950 440, 1250 520"/>
        <path d="M-50 545 C 150 465, 350 625, 550 545 S 950 465, 1250 545"/>
        <path d="M-50 570 C 150 490, 350 650, 550 570 S 950 490, 1250 570"/>
        <path d="M-50 595 C 150 515, 350 675, 550 595 S 950 515, 1250 595"/>
        <path d="M-50 620 C 150 540, 350 700, 550 620 S 950 540, 1250 620"/>
    </g>
    <g fill="none" stroke="#8a6d2f" stroke-opacity="0.12">
        <path d="M-50 60 C 200 140, 400 -20, 650 60 S 1050 140, 1250 60"/>
        <path d="M-50 85 C 200 165, 400 5, 650 85 S 1050 165, 1250 85"/>
        <path d="M-50 110 C 200 190, 400 30, 650 110 S 1050 190, 1250 110"/>
    </g>

    <!-- ornamental rosettes -->
    <use href="#rosette" transform="translate(1080 120)"/>
    <use href="#rosette" transform="translate(140 560) scale(1.4)"/>

    <!-- fine border frame -->
    <rect x="14" y="14" width="1172" height="612" fill="none" stroke="#8a6d2f" stroke-opacity="0.28"/>
    <rect x="22" y="22" width="1156" height="596" fill="none" stroke="#8a6d2f" stroke-opacity="0.16"/>
</svg>
