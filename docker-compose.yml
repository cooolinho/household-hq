services:
    personal-home-portal:
        container_name: "personal-home-portal"
        build:
            context: './docker'
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - "${APP_PORT:-80}:80"
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - './laravel:/var/www/html'
            - './logs/laravel:/var/www/html/storage/logs'
            - './logs/supervisord:/var/log/supervisor'
            - './docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - personal_home_portal_network
        depends_on:
            - personal-home-portal-db
            - personal-home-portal-cache
            - personal-home-portal-mailpit

    personal-home-portal-db:
        container_name: "personal-home-portal-db"
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: "${MYSQL_DATABASE}"
            MYSQL_USER: "${MYSQL_USER}"
            MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        networks:
            - personal_home_portal_network
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-p${MYSQL_PASSWORD}"
            retries: 3
            timeout: 5s

    personal-home-portal-cache:
        container_name: "personal-home-portal-cache"
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'personal-home-portal-cache:/data'
        networks:
            - personal_home_portal_network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    personal-home-portal-mailpit:
        container_name: "personal-home-portal-mailpit"
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - personal_home_portal_network

networks:
    personal_home_portal_network:
        driver: bridge

volumes:
    personal-home-portal-cache:
        driver: local
