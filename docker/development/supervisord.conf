[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/var/log/supervisor/php.out.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisor/php.err.log
stderr_logfile_maxbytes=0

# Laravel Horizon: supervises the Redis queue workers (replaces the plain
# `queue:work` process). stopsignal/stopwaitsecs give running jobs time to
# finish gracefully instead of being killed mid-job on deploy/restart.
# ------------------------------------------------------------------ #
[program:horizon]
command=/usr/bin/php /var/www/html/artisan horizon
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=3600
stderr_logfile=/var/log/supervisor/horizon.err.log
stdout_logfile=/var/log/supervisor/horizon.out.log

# Scheduler: run Laravel scheduled tasks as a long-running worker using schedule:work
# schedule:work is a long-running process that listens for scheduled tasks and executes them without an external loop.
# Use this with Supervisor to avoid a manual shell loop and get cleaner process management.
# ------------------------------------------------------------------ #
[program:scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/scheduler.err.log
stdout_logfile=/var/log/supervisor/scheduler.out.log
