; Ersetzt /etc/php/8.5/fpm/pool.d/www.conf vollstaendig.
[www]
user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; clear_env=no ist der Kern der ganzen Config: ohne das wuerden die Worker die
; von Docker gesetzten Variablen (DB_PASSWORD, APP_KEY, REDIS_HOST, ...) nicht
; mehr sehen, weil FPM die Prozessumgebung sonst vor jedem Request leert.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /data/logs/php-fpm-error.log
