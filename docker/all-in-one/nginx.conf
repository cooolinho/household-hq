# Ersetzt /etc/nginx/sites-available/default (weiterhin per Standard-Symlink
# unter sites-enabled/default aktiv). Das Haupt-/etc/nginx/nginx.conf bleibt
# das Ubuntu-Paket-Original (user/worker_processes/mime.types etc.).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Dokumente/Belege/Inventar-Bilder duerfen bis zu 100M gross sein (siehe
    # php.ini upload_max_filesize/post_max_size - beide muessen zusammenpassen).
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /data/logs/nginx-access.log;
    error_log /data/logs/nginx-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Laravels eigener storage-Symlink (public/storage -> storage/app/public)
    # zeigt inzwischen ins /data-Volume - directory listing bleibt trotzdem aus.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Keine .env, .git, etc. ausliefern - nur /.well-known/ (z.B. ACME-Challenges
    # hinter einem TLS-terminierenden Reverse Proxy) bleibt erreichbar.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
