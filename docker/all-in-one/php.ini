[PHP]
; Produktions-Defaults fuer das All-in-One-Image. Ueberschreibt Ubuntu/ondrej-
; Defaults gezielt dort, wo die App groessere Uploads (Dokumente, Belege,
; Inventar-Bilder) und einen stabilen Queue-/Scheduler-Betrieb braucht.
post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 512M
max_execution_time = 300
variables_order = EGPCS
expose_php = Off
display_errors = Off
log_errors = On
error_log = /data/logs/php-error.log
date.timezone = UTC

[opcache]
opcache.enable = 1
; An/aus fuer FPM UND CLI: Horizon und der Scheduler sind lang laufende
; CLI-Prozesse, die von Opcache genauso profitieren wie FPM-Worker.
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Laufzeit-Code aendert sich nach dem Build nicht mehr - kein Overhead durch
; staendige mtime-Checks (ein Update kommt ueber ein neues Image, nicht durch
; Dateien, die sich unter dem laufenden Container aendern).
opcache.validate_timestamps = 0
