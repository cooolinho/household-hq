; All-in-One-Image: supervisord ist PID 1 (per `exec` aus entrypoint.sh) und
; startet App, Horizon, Scheduler sowie die eingebetteten MySQL-/Redis-Server.
; Startreihenfolge ueber priority (klein zuerst); beim Stoppen genau umgekehrt,
; MySQL faehrt also zuletzt und damit sauber herunter.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid

[program:mysql]
command=/usr/sbin/mysqld --defaults-file=/etc/mysql/my.cnf
user=mysql
priority=10
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stdout_logfile=/data/logs/mysql.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/mysql.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis-portal.conf
user=redis
priority=20
autostart=true
autorestart=true
startretries=3
startsecs=3
stopwaitsecs=10
stdout_logfile=/data/logs/redis.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/redis.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

; Einmal-Skript: wartet auf MySQL/Redis, legt DB/User an, migriert, seedet
; Systemkategorien (immer) und Demo-Daten (nur mit --demo), startet danach
; php-fpm/nginx/horizon/scheduler per supervisorctl. autorestart=false, weil
; ein zweiter Lauf nach dem ersten Erfolg nichts mehr zu tun haette.
[program:bootstrap]
command=/usr/local/bin/bootstrap
user=root
priority=30
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/data/logs/bootstrap.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

; php-fpm und nginx starten als root (noetig, um Port 80 zu binden bzw. den
; FPM-Socket anzulegen) und geben Worker-Prozesse ueber ihre eigene Config an
; www-data ab - siehe php-fpm-www.conf ("user = www-data") und nginx.conf
; (Paket-Default "user www-data;" in /etc/nginx/nginx.conf).
[program:php-fpm]
command=/usr/sbin/php-fpm8.5 -F
priority=40
autostart=false
autorestart=true
stopwaitsecs=30
stdout_logfile=/data/logs/php-fpm.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/php-fpm.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=false
autorestart=true
stopwaitsecs=10
stdout_logfile=/data/logs/nginx-supervisor.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/nginx-supervisor.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:horizon]
command=/usr/bin/php8.5 artisan horizon
directory=/var/www/html
user=www-data
priority=60
autostart=false
autorestart=true
; Laufende Jobs (IMAP-Abruf, PDF-Zusammenfuehrung, Neukategorisierung) sollen
; bei stop/restart erst zu Ende laufen, bevor Horizon beendet wird.
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/data/logs/horizon.out.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/horizon.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:scheduler]
command=/usr/bin/php8.5 artisan schedule:work
directory=/var/www/html
user=www-data
priority=70
autostart=false
autorestart=true
stdout_logfile=/data/logs/scheduler.out.log
; schedule:work gibt auch ohne faellige Jobs regelmaessig eine Zeile aus -
; Rotation verhindert, dass /data/logs unbegrenzt waechst.
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/scheduler.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
