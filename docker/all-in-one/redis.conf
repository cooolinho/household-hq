# Wird nach /etc/redis/redis-portal.conf kopiert und von supervisord direkt
# als Konfigurationsdatei uebergeben (ersetzt die Paket-Default-Konfiguration
# vollstaendig, statt sie zu patchen).
bind 127.0.0.1
port 6379
protected-mode no

daemonize no
pidfile /run/redis/redis-server.pid

# /data wird als Volume gemountet - die Queue (Horizon/Redis) uebersteht damit
# Container-Neustarts und Image-Updates.
dir /data/redis
appendonly yes
appendfilename "appendonly.aof"

logfile ""
