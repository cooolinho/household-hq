services:
    household-hq:
        container_name: "${CONTAINER_NAME_APP:-household-hq}"
        image: "${APP_IMAGE:-ghcr.io/cooolinho/household-hq-production:latest}"
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: "${WWWUSER:-www-data}"
            WWWGROUP: "${WWWGROUP:-www-data}"
        labels:
            - "traefik.enable=${TRAEFIK_ENABLED:-true}"
            - "traefik.docker.network=${DOCKER_NETWORK}"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.rule=Host(`${TRAEFIK_SERVICE_NAME}.${TRAEFIK_DOMAIN}`)"
            - "traefik.http.routers.${TRAEFIK_SERVICE_NAME}.entrypoints=web"
            - "traefik.http.services.${TRAEFIK_SERVICE_NAME}.loadbalancer.server.port=${TRAEFIK_PORT:-80}"
        volumes:
            - '${STORAGE_PATH:-/var/lib/household-hq/storage}:/var/www/html/storage'
            - '${ENV_FILE:-./laravel/.env}:/var/www/html/.env'
        networks:
            - target_network
        depends_on:
            - household-hq-db
            - household-hq-cache
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    household-hq-db:
        container_name: "${CONTAINER_NAME_DB:-household-hq-db}"
        image: 'mysql/mysql-server:8.0'
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: "${MYSQL_DATABASE}"
            MYSQL_USER: "${MYSQL_USER}"
            MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'household-hq-db:/var/lib/mysql'
        networks:
            - target_network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_PASSWORD}"]
            retries: 3
            timeout: 5s

    household-hq-cache:
        container_name: "${CONTAINER_NAME_CACHE:-household-hq-cache}"
        image: 'redis:alpine'
        volumes:
            - 'household-hq-cache:/data'
        networks:
            - target_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

networks:
    target_network:
        name: "${DOCKER_NETWORK:?Please set DOCKER_NETWORK in .env to the name of your project's Docker network.}"
        external: true

volumes:
    household-hq-db:
        driver: local
    household-hq-cache:
        driver: local
