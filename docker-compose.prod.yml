services:
    household-hq:
        container_name: "${CONTAINER_NAME_APP:-household-hq}"
        image: "${APP_IMAGE:-ghcr.io/cooolinho/household-hq-production:latest}"
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: "${WWWUSER:-www-data}"
            WWWGROUP: "${WWWGROUP:-www-data}"
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=docker_lan_network"
            - "traefik.http.routers.household.rule=Host(`household.docker.lan`)"
            - "traefik.http.routers.household.entrypoints=web"
            - "traefik.http.services.household.loadbalancer.server.port=80"
        volumes:
            - '${STORAGE_PATH:-/var/lib/household-hq/storage}:/var/www/html/storage'
        networks:
            - docker_lan_network
        depends_on:
            - household-hq-db
            - household-hq-cache
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    household-hq-db:
        container_name: "${CONTAINER_NAME_DB:-household-hq-db}"
        image: 'mysql/mysql-server:8.0'
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: "${MYSQL_DATABASE}"
            MYSQL_USER: "${MYSQL_USER}"
            MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'household-hq-db:/var/lib/mysql'
        networks:
            - docker_lan_network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_PASSWORD}"]
            retries: 3
            timeout: 5s

    household-hq-cache:
        container_name: "${CONTAINER_NAME_CACHE:-household-hq-cache}"
        image: 'redis:alpine'
        volumes:
            - 'household-hq-cache:/data'
        networks:
            - docker_lan_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

networks:
    docker_lan_network:
        external: true

volumes:
    household-hq-db:
        driver: local
    household-hq-cache:
        driver: local
