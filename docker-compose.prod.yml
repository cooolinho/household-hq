services:
    personal-home-portal:
        container_name: "personal-home-portal"
        build:
            context: './docker'
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=docker_lan_network"
            - "traefik.http.routers.personal.rule=Host(`personal.docker.lan`)"
            - "traefik.http.routers.personal.entrypoints=web"
            - "traefik.http.services.personal.loadbalancer.server.port=80"
        volumes:
            - './laravel:/var/www/html'
            - './docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - docker_lan_network
        depends_on:
            - personal-home-portal-db
            - personal-home-portal-cache
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    personal-home-portal-db:
        container_name: "personal-home-portal-db"
        image: 'mysql/mysql-server:8.0'
        environment:
            MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: "${MYSQL_DATABASE}"
            MYSQL_USER: "${MYSQL_USER}"
            MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'personal-home-portal-db:/var/lib/mysql'
        networks:
            - docker_lan_network
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-p${MYSQL_PASSWORD}"
            retries: 3
            timeout: 5s

    personal-home-portal-cache:
        container_name: "personal-home-portal-cache"
        image: 'redis:alpine'
        volumes:
            - 'personal-home-portal-cache:/data'
        networks:
            - docker_lan_network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    docker_lan_network:
        external: true

volumes:
    personal-home-portal-db:
        driver: local
    personal-home-portal-cache:
        driver: local
