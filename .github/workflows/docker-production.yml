name: Docker Production Image

# Baut das Schlanke Production-Image (docker/production/Dockerfile) und veroeffentlicht es
# nach ghcr.io - entweder durch das Pushen eines Versions-Tags (YYYY.M.D,
# optional ".N" fuer ein zweites Release am selben Tag) oder manuell ueber
# "Run workflow".
on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYYY.M.D oder YYYY.M.D.N) - leer laesst das heutige Datum (UTC) verwenden'
        required: false
        type: string

concurrency:
  group: docker-production-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build and publish production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-v$(date -u +%Y.%-m.%-d)}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$VERSION" =~ ^v[0-9]{4}\.(1[0-2]|[1-9])\.(3[01]|[12][0-9]|[1-9])(\.[0-9]+)?$ ]]; then
            echo "::error::Ungueltiges Versionsformat: '${VERSION}' (erwartet YYYY.M.D oder YYYY.M.D.N, z.B. 2026.9.17)"
            exit 1
          fi

          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-production
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=raw,value=production
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
